services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resto
      POSTGRES_PASSWORD: resto
      POSTGRES_DB: restoapp
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resto -d restoapp']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://resto:resto@db:5432/restoapp
      API_PORT: '4000'
      NODE_ENV: production
      # Override these before exposing the stack to anything real.
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PRINTER_DRIVER: ${PRINTER_DRIVER:-none}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    ports: ['4000:4000']
    depends_on:
      db: { condition: service_healthy }
    # Migrate on boot so a fresh volume comes up ready to use.
    command: sh -c "node src/db/migrate.js && node src/server.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
